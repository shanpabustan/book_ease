name: book_ease
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  animations: ^2.0.11
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0


  # cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  google_nav_bar: ^5.0.7
  image_picker: ^1.0.7
  intl: ^0.20.2
  line_icons: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1  # Ensure this is correctly indented

flutter_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/logo-removebg-preview.png
    - assets/images/banner.jpg
    - assets/images/percy-book.jpg
    - assets/images/admin_logo.png
    - assets/images/lord_p.png
    - assets/images/harry-book.jpg

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
