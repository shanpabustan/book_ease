name: book_ease
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  animations: ^2.0.11
  flutter:
    sdk: flutter
  speech_to_text: ^7.0.0
  # cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  google_nav_bar: ^5.0.7
  intl: ^0.20.2
  line_icons: ^2.0.3
  image_picker: ^1.1.2
  permission_handler: ^11.4.0
  flutter_animate: ^4.5.2
  flutter_glow: ^0.3.2
  fl_chart: ^0.70.2
  file_picker: ^10.0.0
